<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro KM/Hora · Frota</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a3a3c">
<style>
  :root{
    --header:#3a3a3c;
    --accent:#fcb040;
    --bg:#f4f4f5;
    --card:#ffffff;
    --text:#232326;
    --muted:#7a7a80;
    --ok:#2e9e4d;
    --err:#d6432f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    background:var(--header); color:#fff; padding:16px 18px;
    display:flex; align-items:center; gap:12px;
  }
  header .logo-box{
    background:#fff; border-radius:10px; padding:6px 10px;
    font-weight:700; color:var(--header); font-size:14px;
  }
  header h1{font-size:16px; margin:0; font-weight:600;}
  header p{margin:2px 0 0; font-size:11px; color:#d8d8da;}

  main{max-width:520px; margin:0 auto; padding:16px;}

  .card{
    background:var(--card); border-radius:14px; padding:16px;
    margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .card h2{
    font-size:14px; margin:0 0 10px; color:var(--header);
    display:flex; align-items:center; gap:8px;
  }
  .step-num{
    background:var(--accent); color:#3a3a3c; font-weight:700;
    width:22px; height:22px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
  }

  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  input[type="text"], input[type="number"], select{
    width:100%; padding:12px 12px; border:1px solid #ddd; border-radius:8px;
    font-size:16px; background:#fff; color:var(--text);
  }
  input:focus, select:focus{outline:2px solid var(--accent); border-color:var(--accent);}

  .capture-btn{
    width:100%; padding:13px; border-radius:10px; border:2px dashed #ccc;
    background:#fafafa; color:var(--muted); font-size:14px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .capture-btn.has-photo{border-style:solid; border-color:var(--ok); color:var(--ok); background:#f2fbf4;}
  .capture-btn:active{opacity:0.8;}

  .preview{
    width:100%; max-height:220px; object-fit:contain; border-radius:8px;
    margin-top:10px; display:none; background:#111;
  }

  .send-btn{
    width:100%; padding:15px; border:none; border-radius:12px;
    background:var(--accent); color:#3a3a3c; font-size:16px; font-weight:700;
    cursor:pointer; margin-top:6px;
  }
  .send-btn:disabled{background:#ddd; color:#999; cursor:not-allowed;}

  .msg{
    padding:12px 14px; border-radius:10px; font-size:13px; margin-top:12px;
    display:none;
  }
  .msg.show{display:block;}
  .msg.ok{background:#eafaee; color:var(--ok);}
  .msg.err{background:#fcecea; color:var(--err);}

  footer{text-align:center; font-size:11px; color:var(--muted); padding:20px 0 30px;}
  input[type="file"]{display:none;}

  .prog-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; border-bottom:1px solid #eee; cursor:pointer;
  }
  .prog-item:last-child{border-bottom:none;}
  .prog-item:active{background:#f7f7f8;}
  .prog-placa{font-weight:700; font-size:14px;}
  .prog-dias{font-size:11px; color:var(--muted); margin-top:2px;}
  .prog-pill{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
    white-space:nowrap;
  }
  .pill-atrasado{background:#fcecea; color:var(--err);}
  .pill-atencao{background:#fff4de; color:#b8792f;}
  .pill-nunca{background:#f0f0f0; color:var(--muted);}
  .pill-emdia{background:#eafaee; color:var(--ok);}
  .prog-empty{font-size:13px; color:var(--muted); padding:6px 4px;}
</style>
</head>
<body>

<header>
  <div class="logo-box">ROTELE</div>
  <div>
    <h1>Registro KM/Hora</h1>
    <p>Rotele Distribuidora de Bebidas · Grupo Rotele · Ambev MS</p>
  </div>
</header>

<main>

  <div class="card" id="cardProgramacao">
    <h2>📋 Programação desta semana</h2>
    <div id="programacaoLoading" style="font-size:13px; color:var(--muted);">Carregando...</div>
    <div id="programacaoLista"></div>
  </div>

  <div class="card">
    <h2><span class="step-num">1</span> Placa</h2>
    <label for="placaInput">Digite ou selecione a placa</label>
    <input type="text" id="placaInput" list="placasList" placeholder="Comece a digitar..." autocomplete="off" style="text-transform:uppercase;">
    <datalist id="placasList"></datalist>

    <label style="margin-top:14px;">Foto da placa</label>
    <button type="button" class="capture-btn" id="btnPlaca">📷 Tirar foto da placa</button>
    <input type="file" id="filePlaca" accept="image/*" capture="environment">
    <img id="previewPlaca" class="preview">
  </div>

  <div class="card">
    <h2><span class="step-num">2</span> Foto do painel (KM e Horímetro)</h2>
    <button type="button" class="capture-btn" id="btnPainel">📷 Tirar foto do painel</button>
    <input type="file" id="filePainel" accept="image/*" capture="environment">
    <img id="previewPainel" class="preview">

    <label for="kmTexto">KM</label>
    <input type="text" id="kmTexto" inputmode="numeric" placeholder="Ex: 123456">

    <label for="horimetroTexto">Horímetro</label>
    <input type="text" id="horimetroTexto" inputmode="decimal" placeholder="Ex: 4582.3">
  </div>

  <button type="button" class="send-btn" id="btnEnviar">Enviar registro</button>
  <div class="msg" id="msgOk">✅ Registro enviado com sucesso!</div>
  <div class="msg" id="msgErr">❌ Erro ao enviar. Verifique a conexão e tente novamente.</div>

</main>

<footer>Rotele · Grupo Rotele · Ambev MS</footer>

<script>
// ============ CONFIGURAÇÃO ============
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxw_21JtdD6S00UImhN1xpvPli79EVAyZOtbZNf7eqSpEulMcuhkuMwYT8kgN5g0ghn/exec";
// =======================================

const PLACAS_ENTREGA = [
  'SML8J65','SML8J74','SML8J75','SML8J78','SML8J80','SML9A16','SML9A75',
  'SML8C96','SML8D61','SML8E21','SML8E26','SML8E30','SML8E32','SML8E33',
  'SML8E35','SML8E47','SML8E48','SML8E49','SML8E51','SML8E52','SML8E53',
  'SML8E54','SML8E63','SML8J63','SML8J64','SML8E09','SML8E13','SML8E18',
  'SML8E97','SML8F01','SML9H33','UGW1D40','UGW1D44','UGW1D46','UGW1D49',
  'UGW1D50','UGW1D51','UGW1D57','UGW1D58','UGW1D60','UGW1D63'
].slice().sort();

const placaInput = document.getElementById('placaInput');
const placasList = document.getElementById('placasList');
PLACAS_ENTREGA.forEach(p => {
  const opt = document.createElement('option');
  opt.value = p;
  placasList.appendChild(opt);
});
placaInput.addEventListener('input', function(){
  this.value = this.value.toUpperCase();
});

let placaFotoBase64 = null;
let painelFotoBase64 = null;

const PILL_CLASS = {
  'Atrasado': 'pill-atrasado',
  'Atenção': 'pill-atencao',
  'Nunca coletado': 'pill-nunca',
  'Em dia': 'pill-emdia'
};

async function carregarProgramacao(){
  const loading = document.getElementById('programacaoLoading');
  const lista = document.getElementById('programacaoLista');
  try{
    const resp = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    const data = await resp.json();
    loading.style.display = 'none';

    if(data.status !== 'ok' || !data.placas || !data.placas.length){
      lista.innerHTML = '<div class="prog-empty">Nenhuma placa cadastrada na programação.</div>';
      return;
    }

    const pendentes = data.placas.filter(p => p.status !== 'Em dia');
    const paraMostrar = pendentes.length ? pendentes : data.placas;

    lista.innerHTML = '';
    paraMostrar.forEach(p => {
      const item = document.createElement('div');
      item.className = 'prog-item';
      const diasTxt = (p.dias === '' || p.dias === null) ? 'nunca coletado' : `${p.dias} dia(s) atrás`;
      item.innerHTML = `
        <div>
          <div class="prog-placa">${p.placa}</div>
          <div class="prog-dias">${diasTxt}</div>
        </div>
        <div class="prog-pill ${PILL_CLASS[p.status] || 'pill-nunca'}">${p.status}</div>
      `;
      item.addEventListener('click', () => {
        placaInput.value = p.placa;
        document.getElementById('cardProgramacao').scrollIntoView({behavior:'smooth', block:'start'});
      });
      lista.appendChild(item);
    });

    if(!pendentes.length){
      const aviso = document.createElement('div');
      aviso.className = 'prog-empty';
      aviso.textContent = '✅ Toda a frota está em dia esta semana.';
      lista.prepend(aviso);
    }
  }catch(err){
    console.error(err);
    loading.textContent = 'Não foi possível carregar a programação agora.';
  }
}

carregarProgramacao();

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setupCapture(btnId, fileId, previewId, kind){
  const btn = document.getElementById(btnId);
  const fileInput = document.getElementById(fileId);
  const preview = document.getElementById(previewId);

  btn.addEventListener('click', ()=> fileInput.click());

  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;

    const dataUrl = await fileToBase64(file);
    preview.src = dataUrl;
    preview.style.display = 'block';
    btn.textContent = '📷 Foto capturada (toque para repetir)';
    btn.classList.add('has-photo');

    if(kind === 'placa'){ placaFotoBase64 = dataUrl; }
    else if(kind === 'painel'){ painelFotoBase64 = dataUrl; }

    fileInput.value = '';
  });
}

setupCapture('btnPlaca','filePlaca','previewPlaca','placa');
setupCapture('btnPainel','filePainel','previewPainel','painel');

document.getElementById('btnEnviar').addEventListener('click', async ()=>{
  const placa = placaInput.value.trim().toUpperCase();
  const km = document.getElementById('kmTexto').value.trim();
  const horimetro = document.getElementById('horimetroTexto').value.trim();
  const msgOk = document.getElementById('msgOk');
  const msgErr = document.getElementById('msgErr');
  const btn = document.getElementById('btnEnviar');

  msgOk.classList.remove('show');
  msgErr.classList.remove('show');

  if(!placa || !PLACAS_ENTREGA.includes(placa)){
    msgErr.textContent = '⚠️ Selecione uma placa válida da lista.';
    msgErr.classList.add('show');
    return;
  }

  if(!km || !horimetro || !placaFotoBase64 || !painelFotoBase64){
    msgErr.textContent = '⚠️ Tire as duas fotos e preencha KM e Horímetro.';
    msgErr.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const payload = {
    placa, km, horimetro,
    fotoPlaca: placaFotoBase64,
    fotoPainel: painelFotoBase64,
    dataHora: new Date().toISOString()
  };

  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if(data.status === 'ok'){
      msgOk.classList.add('show');
      placaInput.value = '';
      document.getElementById('kmTexto').value = '';
      document.getElementById('horimetroTexto').value = '';
      ['previewPlaca','previewPainel'].forEach(id=>{
        document.getElementById(id).style.display='none';
      });
      document.getElementById('btnPlaca').textContent = '📷 Tirar foto da placa';
      document.getElementById('btnPlaca').classList.remove('has-photo');
      document.getElementById('btnPainel').textContent = '📷 Tirar foto do painel';
      document.getElementById('btnPainel').classList.remove('has-photo');
      placaFotoBase64 = null; painelFotoBase64 = null;
      carregarProgramacao();
    }else{
      throw new Error(data.message || 'erro desconhecido');
    }
  }catch(err){
    console.error(err);
    msgErr.textContent = '❌ Erro ao enviar: ' + err.message;
    msgErr.classList.add('show');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Enviar registro';
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(console.error);
  });
}
</script>
</body>
</html>
